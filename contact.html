    <meta name="viewport" content="width=device-width, initial-scale=3.0">
    <title>Panache | Contact</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

<header>
    <div class="logo">
          <img src="images/P.jpeg" alt="Logo" class="logo">
  </div>
<div class="footer-links">
    <a href="@_panache_atelier_URL">Instagram</a>
    <a href="@_panache_atelier_URL">Facebook</a>
    <a href="@_panache_atelier_URL">TikTok</a>
</div>
   <nav>
    <a href="home.html">Home</a>
    <a href="shop.html">Shop</a>

</nav>
</header>

<section class="page-header">
    <h1>CONTACT US</h1>
    <p>We would love to hear from you.</p>
</section>

<section class="form-section">

    <form id="contactForm" data-demo-form>

        <label for="contactName">Full Name *</label>
        <input id="contactName" name="name" type="text" placeholder="Enter your name" required minlength="2">

        <label for="contactEmail">Email Address *</label>
        <input id="contactEmail" name="email" type="email" placeholder="Enter your email" required>

        <label for="subject">Subject *</label>
        <input id="subject" name="subject" type="text" placeholder="Enter subject" required>

        <label for="message">Message *</label>
        <textarea id="message" name="message" rows="6" placeholder="Enter your message" required minlength="10"></textarea>

        <button class="btn" type="submit">SEND MESSAGE</button>

    </form>

</section>

<footer>
    <p>&copy; 2026 Panache. All Rights Reserved.</p>
</footer>

    <script src="JS/script.js" defer></script>
</body>
</html>
